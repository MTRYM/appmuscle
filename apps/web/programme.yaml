            rpe_cible: 6

          - nom: "Wall Handstand Toe Pulls"
            type: reps
            series: 2
            reps: "4-6"
            description: Micro-volume équilibre. Un pied à la fois, sans perdre la ligne.
            repos_sec: 60
            rpe_cible: 6

          - nom: "Scapular Handstand Shrugs"
            type: reps
            series: 2
            reps: "8-10"
            description: Endurance scapulaire pour handstand. Coudes tendus.
            repos_sec: 60
            rpe_cible: 6

          - nom: "Shoulder Mobility Flow"
            type: isometrique
            series: 1
            duree_sec: "600"
            description: >-
              Mobilité épaule — extension thoracique, flexion, rotation externe. RPE 2
              = récupération, jamais effort.
            repos_sec: 0
            rpe_cible: 2

          - nom: "Hip Mobility Flow"
            type: isometrique
            series: 1
            duree_sec: "600"
            description: Mobilité hanche — RI, adducteurs, fléchisseurs, chevilles.
            repos_sec: 0
            rpe_cible: 2

          - nom: "Dead Bug"
            type: reps
            series: 3
            reps: "10"
            description: Core léger — déplacé du lundi (repos).
            repos_sec: 45
            rpe_cible: 4

          - nom: "Copenhagen Side Plank"
            type: isometrique
            series: 2
            duree_sec: "15-20"
            description: Adducteurs / stabilité pelvienne — volume minimal.
            repos_sec: 45
            rpe_cible: 5

          - nom: "Pogos"
            type: reps
            series: 2
            reps: "15"
            description: >-
              Plyo légère uniquement S1-S2. Pas de sprints/VJ le dimanche — plyo max
              jeudi (audit overlap SNC).
            repos_sec: 60
            rpe_cible: 5


  - nom: "Semaine 2 — Consolidation"

    # Consolide S1. +2,5 kg bench seulement si S1 ≤ RPE 7.

