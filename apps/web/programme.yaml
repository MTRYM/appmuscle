            repos_sec: 45
            rpe_cible: 6

      ############################################################
      # WEDNESDAY — Maison (Front Lever + HSPU + Tuck Planche)
      ############################################################

      - jour: Mercredi
        nom: "Maison — Front Lever + Skills & HSPU"

        exercices:

          - nom: "Dead Hang"
