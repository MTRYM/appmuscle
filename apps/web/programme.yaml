# Programme Athlète Hybride — v2.1 (Calisthenics Skills & Hybrid Strength)
# ─────────────────────────────────────────────────────────────────────────────
# LUNDI = REPOS COMPLET
# 6 séances par semaine : Mardi → Dimanche
# - Mardi : Gym Force Upper (Bench 70kg baseline, Tractions lestées déplacées ici, Dips, OHP)
# - Mercredi : Maison Front Lever + Handstand (10-15s) + Pike/HSPU + Tuck Planche + Core
# - Jeudi : Gym Bas du corps + Plyo VJ + Hang Clean
# - Vendredi : Maison Muscle-Up (qualité fluide) + Handstand + L-Sit & Core (sans doublon Face Pull)
# - Samedi : Maison Front Lever #2 + Tuck Planche #2 + Tirage Calisthenics & Compression Core
# - Dimanche : Récupération active + Mobilité + Handstand flow
#
cycles:

  - nom: "Semaine 1 — Fondations & Calibrage Skills"

    # Reprise des fondations avec nouveau split : tractions lourdes à la salle (Mardi), séances maison 100% calisthenics/core.

    seances:

      ############################################################
      # TUESDAY — Gym (Force Upper Body)
      ############################################################

      - jour: Mardi
        nom: "Gym — Force Upper Body"

        exercices:

          - nom: "Band Pull-Apart"
            type: reps
            series: 2
            reps: "15"
            description: >-
              Échauffement push. Protraction scapulaire, contrôle — prépare épaules
              avant bench et dips.
            repos_sec: 30
            rpe_cible: 3
            groupe: "Échauffement"

          - nom: "Scapular Push-Up"
            type: reps
            series: 2
            reps: "10"
            description: Échauffement push. Mobilité scapulaire, amplitude complète sans charge.
            repos_sec: 30
            rpe_cible: 3
            groupe: "Échauffement"

          - nom: "Push-Up"
            type: reps
            series: 2
            reps: "8-10"
            description: >-
              Échauffement push. Activation pectoraux/triceps, tempo contrôlé. Pas à
              l'échec.
            repos_sec: 45
            rpe_cible: 4
            groupe: "Échauffement"

          - nom: "Bench Press"
            type: reps
            series: 4
            reps: "5"
            description: >-
              Lift push principal. Pause 1 s poitrine, poussée explosive. Niveau
              actuel 70kgx5 validé proprement. Progression conservative (+2,5 kg max
              si RPE cible respecté).
            repos_sec: 180
            rpe_cible: 7

          - nom: "Larsen Press"
            type: reps
            series: 2
            reps: "6"
            description: >-
              Volume push sans pontage. Pieds surélevés, gainage strict, renforce le
              point de blocage au développé couché.
            repos_sec: 150
            rpe_cible: 7

          - nom: "Weighted Pull-Up"
            type: reps
            series: 4
            reps: "5"
            description: >-
              Lift pull lourd principal (déplacé à la salle). Suspension complète,
              prise pronation/semi-pro, tirage explosif sans élan. +15kg de base.
            repos_sec: 180
            rpe_cible: 7

          - nom: "Ring Dip"
            type: reps
            series: 3
            reps: "5"
            description: >-
              Dips aux anneaux ou barres parallèles. Descente contrôlée, épaules en
              dépression, protège le sternum et les épaules.
            repos_sec: 120
            rpe_cible: 6

          - nom: "Standing Dumbbell Overhead Press"
            type: reps
            series: 3
            reps: "8"
            description: >-
              Force verticale push. Transfert direct sur la poussée handstand et HSPU.
              Torse gainé, sans cambrer.
            repos_sec: 120
            rpe_cible: 7

          - nom: "Cable External Rotation"
            type: reps
            series: 3
            reps: "15"
            description: >-
              Prehab coiffe des rotateurs. Priorité longévité épaule face au volume de
              poussée et skills calisthenics.
            repos_sec: 45
            rpe_cible: 6

      ############################################################
      # WEDNESDAY — Maison (Front Lever + HSPU + Tuck Planche)
      ############################################################

      - jour: Mercredi
        nom: "Maison — Front Lever + Skills & HSPU"

        exercices:

          - nom: "Dead Hang"
            type: isometrique
            series: 2
            duree_sec: "20-30"
            description: >-
              Échauffement calisthenics. Décompression épaules, activation du grip
              pour Front Lever et Handstand.
            repos_sec: 30
            rpe_cible: 3
            groupe: "Échauffement"

          - nom: "Scapular Pull-Up"
            type: reps
            series: 2
            reps: "8-10"
            description: >-
              Échauffement calisthenics. Dépression et rétraction scapulaire, coudes
              tendus.
            repos_sec: 45
            rpe_cible: 3
            groupe: "Échauffement"

          - nom: "Band Pull-Apart"
            type: reps
            series: 2
            reps: "15"
            description: >-
              Échauffement calisthenics. Activation rétracteurs et coiffe des
              rotateurs avec élastique.
            repos_sec: 30
            rpe_cible: 3
            groupe: "Échauffement"

          - nom: "Handstand Freestanding Practice"
            type: isometrique
            series: 3
            duree_sec: "10-15"
            description: >-
              Travail d'équilibre libre (1/4 micro-sessions HS). Chercher l'équilibre
              10-15 s, alignement actif des épaules et bassin rétroversé.
            repos_sec: 75
            rpe_cible: 6

          - nom: "Handstand Chest-to-Wall"
            type: isometrique
            series: 2
            duree_sec: "20-30"
            description: >-
              Alignement et endurance posturale. Ventre face au mur, pousser fort dans
              les épaules, côtes rentrées.
            repos_sec: 60
            rpe_cible: 6

          - nom: "Elevated Pike Push-Up"
            type: reps
            series: 3
            reps: "8"
            description: >-
              Progression Handstand Push-Up (HSPU). Trajectoire diagonale (tête devant
              les mains en tripode), coudes serrés à 45°.
            repos_sec: 90
            rpe_cible: 7

          - nom: "Tuck Front Lever Hold"
            type: isometrique
            series: 5
            duree_sec: "12-15"
            description: >-
              Skill #1 profil. Dépression et rétraction scapulaire, bassin
              neutre/rétroversé, bras parfaitement tendus.
            repos_sec: 90
            rpe_cible: 7

          - nom: "Front Lever Raises (Tuck)"
            type: reps
            series: 3
            reps: "4"
            description: >-
              Dynamique Front Lever. Montée explosive, descente contrôlée 3 s sans
              balancer. Bras verrouillés.
            repos_sec: 90
            rpe_cible: 7

          - nom: "Planche Lean"
            type: isometrique
            series: 3
            duree_sec: "15-20"
            description: >-
              Progression Planche (Planche Lean vers Tuck Planche). Protraction
              scapulaire maximale, coudes verrouillés, poids projeté vers l'avant.
            repos_sec: 75
            rpe_cible: 6

          - nom: "Pronated Pull-Up"
            type: reps
            series: 3
            reps: "8"
            description: >-
              Volume tirage calisthenics au poids du corps. Amplitude complète menton
              au-dessus de la barre, tempo 2-0-1.
            repos_sec: 90
            rpe_cible: 7

          - nom: "TRX Inverted Row"
            type: reps
            series: 3
            reps: "10"
            description: >-
              Tirage horizontal maison. Rétraction scapulaire complète, renforce le
              haut du dos pour le Front Lever.
            repos_sec: 75
            rpe_cible: 7

          - nom: "Hollow Body Hold"
            type: isometrique
            series: 3
            duree_sec: "20-30"
            description: >-
              Gainage fondamental gymnastique. Bas du dos collé au sol, côtes
              rentrées, rétroversion du bassin.
            repos_sec: 60
            rpe_cible: 6

          - nom: "Reverse Wrist Curl"
            type: reps
            series: 3
            reps: "15"
            description: >-
              Résilience poignets/coudes. Protection tendineuse face aux contraintes
              du Handstand et de la Planche.
            repos_sec: 45
            rpe_cible: 6

      ############################################################
      # THURSDAY — Gym (Bas du corps + Explosivité)
      ############################################################

      - jour: Jeudi
        nom: "Gym — Bas du corps + Explosivité"

        exercices:

          - nom: "Glute Bridge"
            type: reps
            series: 2
            reps: "12"
            description: Échauffement jambes. Activation fessiers et chaîne postérieure avant squat.
            repos_sec: 30
            rpe_cible: 3
            groupe: "Échauffement"

          - nom: "Bodyweight Squat"
            type: reps
            series: 2
            reps: "10"
            description: Échauffement jambes. Amplitude hanche/genou, tempo lent, torse haut.
            repos_sec: 45
            rpe_cible: 3
            groupe: "Échauffement"

          - nom: "Jump Squat"
            type: reps
            series: 2
            reps: "5"
            description: Échauffement jambes. Réveil SNC léger avant CMJ et clean. Intent modéré.
            repos_sec: 60
            rpe_cible: 4
            groupe: "Échauffement"

          - nom: "Front Squat"
            type: reps
            series: 3
            reps: "5"
            description: >-
              Force bas du corps axiale. Buste vertical, coudes hauts, renforce les
              quadriceps et le core sans comprimer les lombaires.
            repos_sec: 150
            rpe_cible: 7

          - nom: "Countermovement Jump"
            type: reps
            series: 4
            reps: "3"
            description: >-
              Explosivité détente verticale (VJ). Intention maximale sur chaque saut.
              Arrêter si la hauteur diminue.
            repos_sec: 150
            rpe_cible: 6

          - nom: "Hang Power Clean"
            type: reps
            series: 4
            reps: "3"
            description: >-
              Production de force rapide. Extension triple explosive
              hanches-genoux-chevilles, vitesse de barre prioritaire.
            repos_sec: 150
            rpe_cible: 7

          - nom: "Bulgarian Split Squat"
            type: reps
            series: 3
            reps: "6"
            description: >-
              Force unilatérale. Stabilité du genou, contrôle excentrique, élimine les
              asymétries.
            repos_sec: 120
            rpe_cible: 7

          - nom: "Romanian Deadlift"
            type: reps
            series: 3
            reps: "6"
            description: >-
              Chaîne postérieure (ischios/fessiers). Charnière de hanche propre, dos
              neutre, étirement contrôlé.
            repos_sec: 120
            rpe_cible: 7

          - nom: "Pallof Press"
            type: reps
            series: 3
            reps: "12"
            description: Anti-rotation du tronc. Résister à la torsion, stabilité du bassin.
            repos_sec: 45
            rpe_cible: 6

      ############################################################
      # FRIDAY — Maison (Handstand + L-Sit & Core)
      ############################################################

      - jour: Vendredi
        nom: "Maison — Handstand & L-Sit Core"

        exercices:

          - nom: "Dead Hang"
            type: isometrique
            series: 2
            duree_sec: "20-30"
            description: >-
              Échauffement calisthenics. Décompression épaules, activation du grip
              pour Handstand et L-Sit.
            repos_sec: 30
            rpe_cible: 3
            groupe: "Échauffement"

          - nom: "Scapular Pull-Up"
            type: reps
            series: 2
            reps: "8-10"
            description: >-
              Échauffement calisthenics. Dépression et rétraction scapulaire, coudes
              tendus.
            repos_sec: 45
            rpe_cible: 3
            groupe: "Échauffement"

          - nom: "Band Pull-Apart"
            type: reps
            series: 2
            reps: "15"
            description: >-
              Échauffement calisthenics. Activation rétracteurs et coiffe des
              rotateurs avec élastique.
            repos_sec: 30
            rpe_cible: 3
            groupe: "Échauffement"

          - nom: "Handstand Freestanding Practice"
            type: isometrique
            series: 3
            duree_sec: "10-15"
            description: >-
              Travail d'équilibre libre (2/4 micro-sessions HS). Focus sur les
              micro-ajustements des doigts et la ligne droite.
            repos_sec: 75
            rpe_cible: 6

          - nom: "Wall Handstand Toe Pulls"
            type: reps
            series: 2
            reps: "4-6"
            description: >-
              Contrôle de l'équilibre. Face au mur, décoller un pied puis l'autre avec
              la pression des doigts sans arquer.
            repos_sec: 60
            rpe_cible: 6

          - nom: "Tuck L-Sit Hold"
            type: isometrique
            series: 3
            duree_sec: "10-15"
            description: >-
              Progression L-Sit et préparation à l'enchaînement L-Sit to Handstand.
              Dépression scapulaire active, compression abdominale, jambes tendues.
            repos_sec: 75
            rpe_cible: 6

          - nom: "Wall Handstand Shoulder Taps"
            type: reps
            series: 3
            reps: "6-8"
            description: >-
              Mouvement autour du Handstand & stabilité unilatérale. Face au mur,
              transférer le poids et toucher l'épaule opposée sans désaxer le bassin.
            repos_sec: 75
            rpe_cible: 6.5

          - nom: "Dragon Flag (Négatives / Holds)"
            type: reps
            series: 3
            reps: "5"
            description: >-
              Force de compression et anti-extension lourde. Corps rigide aligné,
              descente lente contrôlée 3-4 s sans casser les hanches.
            repos_sec: 90
            rpe_cible: 6

          - nom: "Hanging Knee-to-Chest Lift"
            type: reps
            series: 3
            reps: "10"
            description: >-
              Compression abdominale et flexion de hanche suspendu à la barre. Montée
              explosive des genoux vers la poitrine sans balancer.
            repos_sec: 60
            rpe_cible: 6

          - nom: "Copenhagen Side Plank"
            type: isometrique
            series: 2
            duree_sec: "15-20"
            description: >-
              Stabilité pelvienne et adducteurs. Renforcement du bassin pour les
              maintiens gymniques.
            repos_sec: 45
            rpe_cible: 5

      ############################################################
      # SATURDAY — Maison (Front Lever #2 + Planche #2 + Tirage Skills)
      ############################################################

      - jour: Samedi
        nom: "Maison — Front Lever & Planche Skills"

        exercices:

          - nom: "Dead Hang"
            type: isometrique
            series: 2
            duree_sec: "20-30"
            description: >-
              Échauffement calisthenics. Décompression épaules, activation du grip
              pour Front Lever et Planche.
            repos_sec: 30
            rpe_cible: 3
            groupe: "Échauffement"

          - nom: "Scapular Pull-Up"
            type: reps
            series: 2
            reps: "8-10"
            description: >-
              Échauffement calisthenics. Dépression et rétraction scapulaire, coudes
              tendus.
            repos_sec: 45
            rpe_cible: 3
            groupe: "Échauffement"

          - nom: "Band Pull-Apart"
            type: reps
            series: 2
            reps: "15"
            description: >-
              Échauffement calisthenics. Activation rétracteurs et coiffe des
              rotateurs avec élastique.
            repos_sec: 30
            rpe_cible: 3
            groupe: "Échauffement"

          - nom: "Handstand Freestanding Practice"
            type: isometrique
            series: 3
            duree_sec: "10-15"
            description: >-
              Travail d'équilibre libre (3/4 micro-sessions HS). Répétition des
              montées (kick-up) propres et recherche du point d'équilibre.
            repos_sec: 75
            rpe_cible: 6

          - nom: "Scapular Handstand Shrugs"
            type: reps
            series: 2
            reps: "8-10"
            description: >-
              Endurance scapulaire en élévation. Coudes verrouillés, pousser le sol
              pour élever et abaisser les omoplates.
            repos_sec: 60
            rpe_cible: 6

          - nom: "Tuck Front Lever Hold"
            type: isometrique
            series: 4
            duree_sec: "12-15"
            description: >-
              2e exposition FL de la semaine. Focus sur la pureté posturale et la
              tenue isométrique sans compensation lombaire.
            repos_sec: 90
            rpe_cible: 6

          - nom: "Front Lever Scapular Pull"
            type: reps
            series: 3
            reps: "8"
            description: >-
              Endurance dépression scapulaire. Initier la traction bras tendus
              uniquement avec les grands dorsaux et abaisseurs d'omoplates.
            repos_sec: 75
            rpe_cible: 6

          - nom: "Planche Lean"
            type: isometrique
            series: 3
            duree_sec: "15-20"
            description: >-
              2e exposition Planche de la semaine. Protraction scapulaire et avancée
              maximale des épaules.
            repos_sec: 75
            rpe_cible: 6

          - nom: "Pronated Pull-Up"
            type: reps
            series: 3
            reps: "8"
            description: >-
              Force unilatérale de tirage calisthenics. Tirer vers un bras pendant que
              l'autre assiste bras tendu sur la barre.
            repos_sec: 90
            rpe_cible: 7

          - nom: "Band Biceps Curl"
            type: reps
            series: 2
            reps: "12-15"
            description: >-
              Hypertrophie et protection des tendons du coude avec bande élastique.
              Maintien du pic de contraction 1 s.
            repos_sec: 60
            rpe_cible: 7

          - nom: "Seated Pike Compression Leg Lift"
            type: reps
            series: 3
            reps: "10"
            description: >-
              Force de compression active abdos/psoas. Assis jambes tendues au sol,
              lever les pieds sans reculer le buste (transfert L-Sit & Press to HS).
            repos_sec: 60
            rpe_cible: 6

          - nom: "Reverse Wrist Curl"
            type: reps
            series: 3
            reps: "15"
            description: >-
              Renforcement fléchisseurs/extenseurs poignets avec bande ou léger lest
              maison.
            repos_sec: 45
            rpe_cible: 6

      ############################################################
      # SUNDAY — Gym (Récupération active + Muscle-Up + Mobilité)
      ############################################################

      - jour: Dimanche
        nom: "Récupération active — Mobilité + Skills"

        exercices:

          - nom: "Dead Hang"
            type: isometrique
            series: 1
            duree_sec: "20"
            description: Échauffement récup. Décompression légère avant mobilité.
            repos_sec: 0
            rpe_cible: 2
            groupe: "Échauffement"

          - nom: "Scapular Push-Up"
            type: reps
            series: 2
            reps: "8"
            description: Échauffement récup. Activation douce épaules avant flows mobilité.
            repos_sec: 30
            rpe_cible: 2
            groupe: "Échauffement"

          - nom: "Strict Muscle-Up (Qualité)"
            type: reps
            series: 3
            reps: "1-2"
            description: >-
              Maintenance Muscle-Up à la salle sur barre haute. Mouvement fluide et
              propre, transition symétrique sans élan excessif, descente contrôlée.
            repos_sec: 120
            rpe_cible: 6

          - nom: "Handstand Balance Flow"
            type: isometrique
            series: 3
            duree_sec: "10-15"
            description: >-
              Session handstand légère (4/4 de la semaine). Sensation de balance libre
              sans fatigue ni échec, plaisir du mouvement.
            repos_sec: 60
            rpe_cible: 5

          - nom: "Shoulder Mobility Flow"
            type: isometrique
            series: 1
            duree_sec: "600"
            description: >-
              Mobilité active des épaules (10 min). Ouverture thoracique, flexion
              complète, rotation externe. Récupération sans forcer.
            repos_sec: 0
            rpe_cible: 2

          - nom: "Hip Mobility Flow"
            type: isometrique
            series: 1
            duree_sec: "600"
            description: >-
              Mobilité hanches et chevilles (10 min). Rotation interne/externe,
              fléchisseurs, grand écart facial préparatoire.
            repos_sec: 0
            rpe_cible: 2

          - nom: "Dead Bug"
            type: reps
            series: 3
            reps: "10"
            description: >-
              Coordination motrice et activation transverse/obliques. Respiration
              lente diaphragmatique.
            repos_sec: 45
            rpe_cible: 4

          - nom: "Copenhagen Side Plank"
            type: isometrique
            series: 2
            duree_sec: "15-20"
            description: Stabilité pelvienne latérale.
            repos_sec: 45
            rpe_cible: 5

          - nom: "Pogos"
            type: reps
            series: 2
            reps: "15"
            description: >-
              Plyo légère de réactivité de cheville. Contact sol minimal, genoux
              verrouillés.
            repos_sec: 60
            rpe_cible: 5


  - nom: "Semaine 2 — Consolidation & Montée en Charge"

    # Consolidation technique et régularité handstand (10-15s). Progression des maintiens FL tuck.

    seances:

      ############################################################
      # TUESDAY — Gym (Force Upper Body)
