# Programme Athlète Hybride — v4.0 (Transition Mois 2 + Macrocycle 3 Mois : Nov 2026 → Fév 2027)
# ─────────────────────────────────────────────────────────────────────────────
# PROFIL BIOMÉCANIQUE : 16 ans · 193 cm · 83 kg · Envergure 195 cm · Jambes 95 cm · Bras 64 cm
# LUNDI = REPOS COMPLET | 6 séances / semaine : Mardi → Dimanche
# - Mardi (Salle)    : Force Upper Body (Bench, Weighted Pull-Up 4×3-4 explosifs, Weighted Dip, OHP, Chest-Supported Row)
# - Mercredi (Maison): Front Lever #1 (Progression angulaire sans triche élastique) + Handstand/HSPU Concentrique + Cou
# - Jeudi (Maison)   : Planche #1 (sur coudes 100 % frais : Tuck Planche Float/Hold) + Transition L-Sit → Tuck HS + Core
# - Vendredi (Maison): Front Lever #2 + Pseudo Planche Push-Up + TRX Inverted Row + Préhab Coude & Cou
# - Samedi (Salle)   : Bas du corps + Explosivité PAP (Front Squat talons surélevés + CMJ + Power Clean + RDL)
# - Dimanche (Salle) : Pliométrie Réactive (Depth Jump) + Muscle-Up + Straight-Arm Lat Pulldown + Mobilité Structurée
#
cycles:

  - nom: "Semaine 1 — Reset & Fondations Volume"

    # Semaine 1 Mois 2 (Historique).

    seances:

      ############################################################
      # TUESDAY — Salle (Force Upper Body & Rétraction Scapulaire)
      ############################################################

      - jour: Mardi
        nom: "Salle — Force Upper Body"

        exercices:

          - nom: "Band Pull-Apart"
            type: reps
            series: 2
            reps: "15"
            description: >-
              Échauffement push. Activation rétracteurs scapulaires et coiffe
              postérieure avant développé couché.
            repos_sec: 30
            rpe_cible: 3
            groupe: "Échauffement"

          - nom: "Scapular Push-Up"
            type: reps
            series: 2
            reps: "10"
            description: >-
              Échauffement push. Mobilisation protraction/rétraction du dentelé
              antérieur, coudes verrouillés.
            repos_sec: 30
            rpe_cible: 3
            groupe: "Échauffement"

          - nom: "Push-Up"
            type: reps
            series: 2
            reps: "8"
            description: >-
              Échauffement push. Montée en température pectoraux/triceps avec contrôle
              excentrique.
            repos_sec: 45
            rpe_cible: 4
            groupe: "Échauffement"

          - nom: "Bench Press"
            type: reps
            series: 4
            reps: "4"
            description: Lift push principal.
            repos_sec: 180
            rpe_cible: 7

          - nom: "Larsen Press"
            type: reps
            series: 2
            reps: "5"
            description: Volume push sans pontage.
            repos_sec: 150
            rpe_cible: 7

          - nom: "Weighted Pull-Up"
            type: reps
            series: 4
            reps: "5"
            description: >-
              Redescente à +10kg pour construire du volume propre. Suspension
              complète, tirage explosif, JAMAIS à l'échec.
            repos_sec: 180
            rpe_cible: 6.5

          - nom: "Ring Dip"
            type: reps
            series: 3
            reps: "5"
            description: Dips aux barres parallèles.
            repos_sec: 120
            rpe_cible: 6.5

          - nom: "Standing Dumbbell Overhead Press"
            type: reps
            series: 3
            reps: "8"
            description: Force verticale push.
            repos_sec: 120
            rpe_cible: 7

          - nom: "Cable External Rotation"
            type: reps
            series: 3
            reps: "15"
            description: Prehab coiffe des rotateurs.
            repos_sec: 45
            rpe_cible: 6

