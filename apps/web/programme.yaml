            series: 2
            reps: "4-6"
            description: Micro-volume équilibre. Un pied à la fois, sans perdre la ligne.
            repos_sec: 60
            rpe_cible: 6

          - nom: "Scapular Handstand Shrugs"
            type: reps
            series: 2
            reps: "8-10"
            description: Endurance scapulaire pour handstand. Coudes tendus.
            repos_sec: 60
            rpe_cible: 6

          - nom: "Tuck Front Lever Hold"
            type: isometrique
            series: 4
            duree_sec: "12-15"
            description: >-
              2e exposition FL/semaine (profil : 2-3×). Qualité technique, RPE plus
              bas qu'en mercredi.
            repos_sec: 90
            rpe_cible: 6

          - nom: "Front Lever Scapular Pull"
            type: reps
            series: 3
            reps: "8"
            description: Endurance dépression scapulaire (faiblesse profil).
            repos_sec: 75
            rpe_cible: 6

          - nom: "Planche Lean"
            type: isometrique
            series: 3
            duree_sec: "15-20"
            description: >-
              Préparation planche long terme (objectif profil). Épaules devant
              poignets, protraction, jambes tendues. Investissement minimal sans
              fatigue majeure.
            repos_sec: 60
            rpe_cible: 6

          - nom: "Pronated Pull-Up"
            type: reps
            series: 3
            reps: "8"
            description: >-
              Volume tirage modéré — C2B et rows redondants retirés (audit : ~50 sets
              pull/sem). Excentrique contrôlé.
            repos_sec: 90
            rpe_cible: 7

          - nom: "Bayesian Cable Curl"
            type: reps
            series: 2
            reps: "10-12"
            description: Seul curl direct/semaine.
            repos_sec: 60
            rpe_cible: 7

      ############################################################
      # SUNDAY — Récupération active
      ############################################################

      - jour: Dimanche
        nom: "Récupération active — Mobilité + Skills"

        exercices:

          - nom: "Dead Hang"
            type: isometrique
            series: 1
            duree_sec: "20"
            description: Échauffement récup. Décompression légère avant mobilité.
            repos_sec: 0
            rpe_cible: 2
            groupe: "Échauffement"

          - nom: "Scapular Push-Up"
            type: reps
            series: 2
            reps: "8"
            description: Échauffement récup. Activation douce épaules avant flows mobilité.
            repos_sec: 30
            rpe_cible: 2
            groupe: "Échauffement"

          - nom: "Handstand Chest-to-Wall"
            type: isometrique
            series: 3
            duree_sec: "20-30"
            description: >-
              Session handstand 4/4 de la semaine. Priorité alignement : épaules
