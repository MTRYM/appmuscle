# Programme Athlète Hybride — v3.0 (Mois 2 — Octobre 2026)
# ─────────────────────────────────────────────────────────────────────────────
# LUNDI = REPOS COMPLET
# 6 séances par semaine : Mardi → Dimanche
# - Mardi : Salle — Force Upper (Bench 77kg baseline, Tractions lestées RESET +10kg→+15kg, Dips, OHP)
# - Mercredi : Maison — Front Lever + Handstand + HSPU prep + Core
# - Jeudi : Maison — Handstand + L-Sit + Core + Dragon Flag
# - Vendredi : Maison — Front Lever #2 + Planche Lean + Tirage Skills
# - Samedi : Salle — Bas du corps + Explosivité (Front Squat 60kg baseline)
# - Dimanche : Salle — Récup active + Muscle-Up + Mobilité
#
# CORRECTIONS MOIS 2:
# - Tractions lestées: RESET +10kg (build volume) → +12.5kg → +15kg en S5
# - Tuck Planche Hold: remplacé par Planche Lean (maîtrisé, 15-20s)
# - FL Scapula Pull: remplacé par Tuck FL Negatives (plus accessible)
# - Tuck FL Hold: plafonné à 4 séries × 15s (pas de série poubelle)
# - Toutes les séances ≤ 1h
# - Salle: Mardi, Samedi, Dimanche (au lieu de Mardi, Jeudi, Dimanche)
#
cycles:

  - nom: "Semaine 1 — Reset & Fondations Volume"

    # Reset des tractions lestées à +10kg (volume propre RPE 6-7). Bench continue depuis 77kg. FL Scapula Pull remplacé par Tuck FL Negatives. Tuck Planche Hold remplacé par Planche Lean.

    seances:

      ############################################################
      # TUESDAY — Salle (Force Upper Body)
      ############################################################

      - jour: Mardi
        nom: "Salle — Force Upper Body"

        exercices:

          - nom: "Band Pull-Apart"
            type: reps
            series: 2
            reps: "15"
            description: >-
              Échauffement push. Protraction scapulaire, contrôle — prépare épaules
              avant bench et dips.
            repos_sec: 30
            rpe_cible: 3
            groupe: "Échauffement"

          - nom: "Scapular Push-Up"
            type: reps
            series: 2
            reps: "10"
            description: Échauffement push. Mobilité scapulaire, amplitude complète sans charge.
            repos_sec: 30
            rpe_cible: 3
            groupe: "Échauffement"

          - nom: "Push-Up"
            type: reps
            series: 2
            reps: "8-10"
            description: >-
              Échauffement push. Activation pectoraux/triceps, tempo contrôlé. Pas à
              l'échec.
            repos_sec: 45
            rpe_cible: 4
            groupe: "Échauffement"

          - nom: "Bench Press"
            type: reps
            series: 4
            reps: "4"
            description: >-
              Lift push principal. Pause 1 s poitrine, poussée explosive. Baseline
              Mois 2: 77kg. Progression +2.5kg si RPE cible respecté.
            repos_sec: 180
            rpe_cible: 7

          - nom: "Larsen Press"
            type: reps
            series: 2
            reps: "5"
            description: >-
              Volume push sans pontage. Pieds surélevés, gainage strict, renforce le
              point de blocage au développé couché.
            repos_sec: 150
            rpe_cible: 7

          - nom: "Weighted Pull-Up"
            type: reps
            series: 4
            reps: "5"
            description: >-
              Redescente à +10kg pour construire du volume propre. Suspension
              complète, tirage explosif, JAMAIS à l'échec. Même stratégie que le Bench
              mois 1 (+2.5kg/sem → +7kg en 6 semaines).
            repos_sec: 180
            rpe_cible: 6.5

          - nom: "Ring Dip"
            type: reps
            series: 3
            reps: "5"
            description: >-
              Dips aux anneaux ou barres parallèles. Descente contrôlée, épaules en
              dépression, protège le sternum.
            repos_sec: 120
            rpe_cible: 6.5

          - nom: "Standing Dumbbell Overhead Press"
            type: reps
            series: 3
            reps: "8"
            description: Force verticale push. Transfert direct sur HSPU. Torse gainé, sans cambrer.
            repos_sec: 120
            rpe_cible: 7

          - nom: "Cable External Rotation"
            type: reps
            series: 3
            reps: "15"
            description: >-
              Prehab coiffe des rotateurs. Priorité longévité épaule face au volume de
              poussée et skills.
            repos_sec: 45
            rpe_cible: 6

      ############################################################
      # WEDNESDAY — Maison (Front Lever + HSPU + Handstand)
      ############################################################

      - jour: Mercredi
        nom: "Maison — Front Lever + Handstand & HSPU"

        exercices:

          - nom: "Dead Hang"
            type: isometrique
            series: 2
            duree_sec: "20-30"
            description: >-
              Échauffement calisthenics. Décompression épaules, activation du grip
              pour Front Lever et Handstand.
            repos_sec: 30
            rpe_cible: 3
            groupe: "Échauffement"

          - nom: "Scapular Pull-Up"
            type: reps
            series: 2
            reps: "8-10"
            description: >-
              Échauffement calisthenics. Dépression et rétraction scapulaire, coudes
              tendus.
            repos_sec: 45
            rpe_cible: 3
            groupe: "Échauffement"

          - nom: "Band Pull-Apart"
            type: reps
            series: 2
            reps: "15"
            description: >-
              Échauffement calisthenics. Activation rétracteurs et coiffe des
              rotateurs avec élastique.
            repos_sec: 30
            rpe_cible: 3
            groupe: "Échauffement"

          - nom: "Handstand Freestanding Practice"
            type: isometrique
            series: 3
            duree_sec: "10-15"
            description: >-
              Travail d'équilibre libre (1/3 sessions HS). Chercher 10-15 s
              d'équilibre, alignement actif épaules et bassin rétroversé.
            repos_sec: 75
            rpe_cible: 6

          - nom: "Handstand Chest-to-Wall"
            type: isometrique
            series: 2
            duree_sec: "20-30"
            description: >-
              Alignement et endurance posturale. Ventre face au mur, pousser fort dans
              les épaules, côtes rentrées.
            repos_sec: 60
            rpe_cible: 6

          - nom: "Elevated Pike Push-Up"
            type: reps
            series: 3
            reps: "8-10"
            description: Progression HSPU. Trajectoire diagonale, coudes serrés à 45°.
            repos_sec: 90
            rpe_cible: 7

          - nom: "Tuck Front Lever Hold"
            type: isometrique
            series: 4
            duree_sec: "15"
            description: >-
              Skill #1 profil. 4 séries max de 15s propres. Dépression et rétraction
              scapulaire, bassin rétroversé, bras tendus. Pas de série poubelle.
            repos_sec: 90
            rpe_cible: 7

          - nom: "Front Lever Raises (Tuck)"
            type: reps
            series: 3
            reps: "4-5"
            description: >-
              Dynamique Front Lever. Montée explosive, descente contrôlée 3 s. Bras
              verrouillés.
            repos_sec: 90
            rpe_cible: 7

          - nom: "Hollow Body Hold"
            type: isometrique
            series: 3
            duree_sec: "25-30"
            description: >-
              Gainage fondamental gymnastique. Bas du dos collé au sol, côtes
              rentrées, rétroversion du bassin.
            repos_sec: 60
            rpe_cible: 6

          - nom: "Reverse Wrist Curl"
            type: reps
            series: 3
            reps: "15"
            description: >-
              Résilience poignets/coudes. Protection tendineuse pour Handstand et
              Planche.
            repos_sec: 45
            rpe_cible: 6

      ############################################################
      # THURSDAY — Maison (Handstand + L-Sit & Core)
      ############################################################

      - jour: Jeudi
        nom: "Maison — Handstand & L-Sit Core"

        exercices:

          - nom: "Dead Hang"
            type: isometrique
            series: 2
            duree_sec: "20-30"
            description: >-
              Échauffement calisthenics. Décompression épaules, activation du grip
              pour Handstand et L-Sit.
            repos_sec: 30
            rpe_cible: 3
            groupe: "Échauffement"

          - nom: "Scapular Pull-Up"
            type: reps
            series: 2
            reps: "8-10"
            description: >-
              Échauffement calisthenics. Dépression et rétraction scapulaire, coudes
              tendus.
            repos_sec: 45
            rpe_cible: 3
            groupe: "Échauffement"

          - nom: "Band Pull-Apart"
            type: reps
            series: 2
            reps: "15"
            description: >-
              Échauffement calisthenics. Activation rétracteurs et coiffe des
              rotateurs avec élastique.
            repos_sec: 30
            rpe_cible: 3
            groupe: "Échauffement"

          - nom: "Handstand Freestanding Practice"
            type: isometrique
            series: 3
            duree_sec: "10-15"
            description: >-
              Travail d'équilibre libre (2/3 sessions HS). Focus micro-ajustements des
              doigts et ligne droite.
            repos_sec: 75
            rpe_cible: 6

          - nom: "Wall Handstand Toe Pulls"
            type: reps
            series: 2
            reps: "4-6"
            description: >-
              Contrôle de l'équilibre. Face au mur, décoller un pied puis l'autre avec
              pression des doigts.
            repos_sec: 60
            rpe_cible: 6

          - nom: "Tuck L-Sit Hold"
            type: isometrique
            series: 3
            duree_sec: "12-15"
            description: >-
              Progression L-Sit → Press to HS. Dépression scapulaire active,
              compression abdominale, jambes tendues.
            repos_sec: 75
            rpe_cible: 6

          - nom: "Wall Handstand Shoulder Taps"
            type: reps
            series: 3
            reps: "6-8"
            description: >-
              Stabilité unilatérale Handstand. Face au mur, transférer le poids et
              toucher l'épaule opposée.
            repos_sec: 75
            rpe_cible: 6.5

          - nom: "Dragon Flag (Négatives / Holds)"
            type: reps
            series: 3
            reps: "5"
            description: >-
              Anti-extension lourde. Corps aligné, descente lente 3-4 s sans casser
              les hanches.
            repos_sec: 90
            rpe_cible: 6

          - nom: "Hanging Knee-to-Chest Lift"
            type: reps
            series: 3
            reps: "10"
            description: Compression abdominale suspendu. Montée explosive des genoux sans balancer.
            repos_sec: 60
            rpe_cible: 6

          - nom: "Copenhagen Side Plank"
            type: isometrique
            series: 2
            duree_sec: "15-20"
            description: >-
              Stabilité pelvienne et adducteurs. Renforcement bassin pour maintiens
              gymniques.
            repos_sec: 45
            rpe_cible: 5

      ############################################################
      # FRIDAY — Maison (Front Lever #2 + Planche Lean + Skills)
      ############################################################

      - jour: Vendredi
        nom: "Maison — Front Lever & Planche Skills"

        exercices:

          - nom: "Dead Hang"
            type: isometrique
            series: 2
            duree_sec: "20-30"
            description: >-
              Échauffement calisthenics. Décompression épaules, activation du grip
              pour Front Lever et Planche.
            repos_sec: 30
            rpe_cible: 3
            groupe: "Échauffement"

          - nom: "Scapular Pull-Up"
            type: reps
            series: 2
            reps: "8-10"
            description: >-
              Échauffement calisthenics. Dépression et rétraction scapulaire, coudes
              tendus.
            repos_sec: 45
            rpe_cible: 3
            groupe: "Échauffement"

          - nom: "Band Pull-Apart"
            type: reps
            series: 2
            reps: "15"
            description: >-
              Échauffement calisthenics. Activation rétracteurs et coiffe des
              rotateurs avec élastique.
            repos_sec: 30
            rpe_cible: 3
            groupe: "Échauffement"

          - nom: "Handstand Freestanding Practice"
            type: isometrique
            series: 3
            duree_sec: "10-15"
            description: >-
              Travail d'équilibre libre (3/3 sessions HS). Répétition des montées
              propres et recherche du point d'équilibre.
            repos_sec: 75
            rpe_cible: 6

          - nom: "Scapular Handstand Shrugs"
            type: reps
            series: 2
            reps: "8-10"
            description: >-
              Endurance scapulaire en élévation. Coudes verrouillés, pousser le sol
              pour élever et abaisser les omoplates.
            repos_sec: 60
            rpe_cible: 6

          - nom: "Tuck Front Lever Hold"
            type: isometrique
            series: 4
            duree_sec: "15"
            description: >-
              2e exposition FL. Focus pureté posturale et tenue isométrique sans
              compensation lombaire. 4 séries de 15s max.
            repos_sec: 90
            rpe_cible: 7

          - nom: "Tuck Front Lever Negative"
            type: reps
            series: 3
            reps: "3"
            description: >-
              Remplace le FL Scapula Pull. Depuis le Tuck FL, descente contrôlée 5-8
              secondes vers le Dead Hang. Renforce la dépression scapulaire et le
              contrôle excentrique. Plus accessible et plus transférable que le
              scapula pull.
            repos_sec: 90
            rpe_cible: 6.5

          - nom: "Planche Lean (Protraction Active)"
            type: isometrique
            series: 3
            duree_sec: "15-20"
            description: >-
              Planche Lean (exo maîtrisé, 15-20s propres). Protraction scapulaire
              maximale, coudes verrouillés, poids projeté vers l'avant. Progresse en
              durée chaque semaine.
            repos_sec: 75
            rpe_cible: 6.5

          - nom: "Archer Pull-Up (Progression)"
            type: reps
            series: 3
            reps: "5"
            description: >-
              Force unilatérale de tirage calisthenics. Tirer vers un bras pendant que
              l'autre assiste bras tendu.
            repos_sec: 90
            rpe_cible: 7

          - nom: "Band Biceps Curl"
            type: reps
            series: 2
            reps: "12-15"
            description: Hypertrophie et protection tendons du coude. Pic de contraction 1 s.
            repos_sec: 60
            rpe_cible: 7

          - nom: "Seated Pike Compression Leg Lift"
            type: reps
            series: 3
            reps: "10"
            description: >-
              Compression active abdos/psoas. Assis jambes tendues, lever les pieds
              (transfert L-Sit & Press to HS).
            repos_sec: 60
            rpe_cible: 6

      ############################################################
      # SATURDAY — Salle (Bas du corps + Explosivité)
      ############################################################

      - jour: Samedi
        nom: "Salle — Bas du corps + Explosivité"

        exercices:

          - nom: "Glute Bridge"
            type: reps
            series: 2
            reps: "12"
            description: Échauffement jambes. Activation fessiers et chaîne postérieure avant squat.
            repos_sec: 30
            rpe_cible: 3
            groupe: "Échauffement"

          - nom: "Bodyweight Squat"
            type: reps
            series: 2
            reps: "10"
            description: Échauffement jambes. Amplitude hanche/genou, tempo lent, torse haut.
            repos_sec: 45
            rpe_cible: 3
            groupe: "Échauffement"

          - nom: "Jump Squat"
            type: reps
            series: 2
            reps: "5"
            description: Échauffement jambes. Réveil SNC léger avant CMJ et clean. Intent modéré.
            repos_sec: 60
            rpe_cible: 4
            groupe: "Échauffement"

          - nom: "Front Squat"
            type: reps
            series: 3
            reps: "5"
            description: >-
              Force bas du corps axiale. Buste vertical, coudes hauts. Baseline Mois
              2: 60kg × 5. Progression conservative.
            repos_sec: 150
            rpe_cible: 7.5

          - nom: "Countermovement Jump"
            type: reps
            series: 4
            reps: "3"
            description: >-
              Explosivité détente verticale (VJ). Intention maximale sur chaque saut.
              Arrêter si la hauteur diminue.
            repos_sec: 150
            rpe_cible: 6

          - nom: "Hang Power Clean"
            type: reps
            series: 4
            reps: "3"
            description: >-
              Production de force rapide. Extension triple explosive
              hanches-genoux-chevilles.
            repos_sec: 150
            rpe_cible: 7

          - nom: "Bulgarian Split Squat"
            type: reps
            series: 3
            reps: "6"
            description: Force unilatérale. Stabilité genou, contrôle excentrique.
            repos_sec: 120
            rpe_cible: 7

          - nom: "Romanian Deadlift"
            type: reps
            series: 3
            reps: "6"
            description: >-
              Chaîne postérieure (ischios/fessiers). Charnière de hanche propre, dos
              neutre.
            repos_sec: 120
            rpe_cible: 7

          - nom: "Pallof Press"
            type: reps
            series: 3
            reps: "12"
            description: Anti-rotation du tronc. Résister à la torsion, stabilité du bassin.
            repos_sec: 45
            rpe_cible: 6

      ############################################################
      # SUNDAY — Salle (Récup + Muscle-Up + Mobilité)
      ############################################################

      - jour: Dimanche
        nom: "Salle — Récup active + Muscle-Up + Mobilité"

        exercices:

          - nom: "Dead Hang"
            type: isometrique
            series: 1
            duree_sec: "20"
            description: Échauffement récup. Décompression légère avant mobilité.
            repos_sec: 0
            rpe_cible: 2
            groupe: "Échauffement"

          - nom: "Scapular Push-Up"
            type: reps
            series: 2
            reps: "8"
            description: Échauffement récup. Activation douce épaules avant flows mobilité.
            repos_sec: 30
            rpe_cible: 2
            groupe: "Échauffement"

          - nom: "Strict Muscle-Up (Qualité)"
            type: reps
            series: 3
            reps: "2"
            description: >-
              Maintenance Muscle-Up sur barre haute. Mouvement fluide et propre,
              transition symétrique sans élan excessif.
            repos_sec: 120
            rpe_cible: 6

          - nom: "Handstand Balance Flow"
            type: isometrique
            series: 3
            duree_sec: "10-15"
            description: >-
              Session handstand légère de fin de semaine. Plaisir du mouvement, pas de
              fatigue.
            repos_sec: 60
            rpe_cible: 5

          - nom: "Shoulder Mobility Flow"
            type: isometrique
            series: 1
            duree_sec: "600"
            description: >-
              Mobilité active épaules (10 min). Ouverture thoracique, flexion
              complète, rotation externe.
            repos_sec: 0
            rpe_cible: 2

          - nom: "Hip Mobility Flow"
            type: isometrique
            series: 1
            duree_sec: "600"
            description: >-
              Mobilité hanches et chevilles (10 min). Rotation interne/externe,
              fléchisseurs.
            repos_sec: 0
            rpe_cible: 2

          - nom: "Dead Bug"
            type: reps
            series: 3
            reps: "10"
            description: >-
              Coordination motrice et activation transverse. Respiration lente
              diaphragmatique.
            repos_sec: 45
            rpe_cible: 4

          - nom: "Copenhagen Side Plank"
            type: isometrique
            series: 2
            duree_sec: "15-20"
            description: Stabilité pelvienne latérale.
            repos_sec: 45
            rpe_cible: 5


  - nom: "Semaine 2 — Consolidation & Régularité"

    # Tractions lestées toujours à +10kg mais RPE monte légèrement. Planche Lean augmente à 18-22s. FL Raises passe à 5 reps.

    seances:

      ############################################################
